name: Arch Linux package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev cmake perl
      - name: Build
        env:
          ZAPFAST_GIPHY_KEY: ${{ secrets.ZAPFAST_GIPHY_KEY || secrets.FASTSAPP_GIPHY_KEY }}
        run: cargo build --release --locked
      - name: Prepare Arch package
        shell: bash
        run: |
          base=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          version="${base}.r${GITHUB_RUN_NUMBER}.g${GITHUB_SHA:0:12}"
          name="zapfast-v${version}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/$name" dist/artifacts
          cp target/release/zapfast "dist/$name/"
          cp README.md LICENSE THIRD-PARTY-NOTICES.md packaging/zapfast-portable.txt "dist/$name/"
          cp --parents packaging/applications/zapfast.desktop packaging/icons/zapfast.svg contrib/omarchy/zapfast.json.tpl contrib/omarchy/zapfast-theme "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          python3 packaging/arch/personal.py "$version" "dist/$name.tar.gz"
          printf 'Commit: %s\nBuild: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > dist/artifacts/BUILD.txt
      - name: Build and test Arch package
        run: |
          docker run --rm -v "$PWD/dist/arch:/work" -w /work archlinux:base-devel bash -euc '
            pacman -Syu --noconfirm
            useradd -m builder
            chown -R builder:builder /work
            runuser -u builder -- makepkg --nodeps --noconfirm
            pacman -U --noconfirm ./*.pkg.tar.zst
            zapfast --version
            pacman -Qk zapfast-bin
          '
          cp dist/arch/*.pkg.tar.zst dist/artifacts/
          cd dist/artifacts
          sha256sum -- *.pkg.tar.zst > checksums.txt
          sha256sum --check checksums.txt
      - name: Upload Arch package
        uses: actions/upload-artifact@v7
        with:
          name: zapfast-arch-x86_64-${{ github.sha }}
          path: dist/artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
